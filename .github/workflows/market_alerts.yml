name: Genera Notifiche Finanziarie

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC - Chiusura Asia / Pre-apertura Europa
    - cron: '30 13 * * *'  # 13:30 UTC - Dati USA / Pre-apertura Wall Street
    - cron: '0 21 * * *'   # 21:00 UTC - Chiusura Wall Street / After-hours

# Evita due esecuzioni sovrapposte che si contenderebbero il push
concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  generate-and-publish-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-genai

      - name: Esegui lo script Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/generate_notification.py

      - name: Committa e pusha le modifiche
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global core.pager cat

          git add interact/push_notifications.html

          if git diff --cached --quiet; then
            echo "Nessuna modifica rilevata, salto il commit."
            exit 0
          fi

          git commit -m "🔔 Market Alert: Aggiornamento automatico notifica [skip ci]"

          if ! git push origin main; then
            echo "⚠️ Conflitto di push, sincronizzo con il server..."
            git rebase --abort || true
            git pull origin main --rebase --no-edit
            git push origin main
          fi
